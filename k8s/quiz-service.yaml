apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-service
  namespace: quiz-app
  labels:
    app: quiz-service
    app.kubernetes.io/part-of: quiz-app
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: quiz-service
  template:
    metadata:
      labels:
        app: quiz-service
        app.kubernetes.io/part-of: quiz-app
        app.kubernetes.io/component: backend
    spec:
      # serviceAccountName: quiz-app-sa   # only needed if/when this service
      # moves to IRSA - see the note in k8s/secrets.yaml. Not required for
      # the current explicit-credentials setup below.
      containers:
        - name: quiz-service
          image: 345483430684.dkr.ecr.ap-south-1.amazonaws.com/quiz-app/quiz-service:latest
          ports:
            - containerPort: 8002
              name: http
          env:
            - name: PORT
              value: "8002"
            - name: AWS_REGION
              value: "ap-south-1"
            - name: QUESTIONS_TABLE
              value: "QuestionsTable"
            # DYNAMODB_ENDPOINT intentionally omitted: unset = real AWS
            # DynamoDB. Only set this if pointing at DynamoDB Local.
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AWS_SECRET_ACCESS_KEY
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: quiz-service
  namespace: quiz-app
  labels:
    app: quiz-service
    app.kubernetes.io/part-of: quiz-app
spec:
  type: ClusterIP
  selector:
    app: quiz-service
  ports:
    - port: 8002
      targetPort: 8002
      protocol: TCP