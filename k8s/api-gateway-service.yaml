apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-service
  namespace: quiz-app
  labels:
    app: api-gateway-service
    app.kubernetes.io/part-of: quiz-app
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-gateway-service
  template:
    metadata:
      labels:
        app: api-gateway-service
        app.kubernetes.io/part-of: quiz-app
        app.kubernetes.io/component: gateway
    spec:
      containers:
        - name: api-gateway-service
          image: 345483430684.dkr.ecr.ap-south-1.amazonaws.com/quiz-app/api-gateway-service:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PORT
              value: "8000"
            - name: NODE_ENV
              value: "production"
            - name: USER_SERVICE_URL
              value: "http://user-service:8001"
            - name: QUIZ_SERVICE_URL
              value: "http://quiz-service:8002"
            - name: RESULT_SERVICE_URL
              value: "http://result-service:8003"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3


---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: quiz-app
  labels:
    app: api-gateway-service
    app.kubernetes.io/part-of: quiz-app
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-protocol: HTTP
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: /health
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-port: "8000"
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:ap-south-1:345483430684:certificate/8472b2e0-1dad-4b72-b0a1-8dd1b50fa48d"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
spec:
  type: LoadBalancer
  loadBalancerClass: eks.amazonaws.com/nlb
  selector:
    app: api-gateway-service
  ports:
    - name: https
      port: 443
      targetPort: 8000
      protocol: TCP
