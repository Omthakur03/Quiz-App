apiVersion: apps/v1
kind: Deployment
metadata:
  name: result-service
  namespace: quiz-app
  labels:
    app: result-service
    app.kubernetes.io/part-of: quiz-app
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: result-service
  template:
    metadata:
      labels:
        app: result-service
        app.kubernetes.io/part-of: quiz-app
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: result-service
          image: 345483430684.dkr.ecr.ap-south-1.amazonaws.com/quiz-app/result-service:latest
          ports:
            - containerPort: 8003
              name: http
          env:
            - name: PORT
              value: "8003"
            - name: AWS_REGION
              value: "ap-south-1"
            - name: RESULTS_TABLE
              value: "QuizResultsTable"
            - name: USER_SERVICE_URL
              value: "http://user-service:8001"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AWS_SECRET_ACCESS_KEY
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: result-service
  namespace: quiz-app
  labels:
    app: result-service
    app.kubernetes.io/part-of: quiz-app
spec:
  type: ClusterIP
  selector:
    app: result-service
  ports:
    - port: 8003
      targetPort: 8003
      protocol: TCP