name: Build and Deploy Result Service

on:
    push:
        branches:
            - main
        paths:
            - "./backend/result-service/**"
            - ".github/workflows/result-service.yml"

env:
    AWS_REGION: ${{secrets.AWS_REGION}}
    ECR_REGISTRY: ${{secrets.ECR_REGISTRY}}
    SERVICE: result-service

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        outputs:
            image_tag: ${{ steps.vars.outputs.image_tag }}
        steps:
            - uses: actions/checkout@v4

            - name: Set Image Tag
              id: vars
              run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            
            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID}}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY}}
                aws-region: ${{ secrets.AWS_REGION}}
            
            - name: Login to ECR
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build and Push Image
              uses: docker/build-push-action@v6 
              with:
                context: ./backend/${{ env.SERVICE }}
                push: true
                tags: |
                    ${{ env.ECR_REGISTRY }}/${{env.SERVICE}}:${{ steps.vars.outputs.image_tag }}
                    ${{env.ECR_REGISTRY}}/${{ env.SERVICE }}:latest

