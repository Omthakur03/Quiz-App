name: Build and Deploy Result Service

on:
    push:
        branches:
            - main
        paths:
            - "./backend/result-service/**"
            - ".github/workflows/result-service.yml"
            - "k8s/result-service.yaml"

env:
    AWS_REGION: ${{secrets.AWS_REGION}}
    EKS_CLUSTER_NAME: ${{secrets.EKS_CLUSTER}}
    ECR_REGISTRY: ${{secrets.ECR_REGISTRY}}
    SERVICE: result-service

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set Image Tag
              id: vars
              run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            
            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID}}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY}}
                aws-region: ${{ secrets.AWS_REGION}}
            
            - name: Login to ECR
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build and Push Image
              uses: docker/build-push-action@v6 
              with:
                context: ./backend/${{ env.SERVICE }}
                push: true
                tags: ${{env.ECR_REGISTRY}}/${{ env.SERVICE }}:latest
    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v4
    
        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ env.AWS_REGION }}
    
        - name: Update kubeconfig for EKS
          run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
    
        - name: Apply namespace (idempotent)
          run: kubectl apply -f k8s/namespace.yaml
    
        - name: Apply Deployment + Service
          run: kubectl apply -f k8s/${{ env.SERVICE }}.yaml

        - name: Force rollout
          run: kubectl rollout restart deployment/${{ env.SERVICE }} -n quiz-app
    
        - name: Wait for rollout
          run: kubectl rollout status deployment/${{ env.SERVICE }} -n quiz-app --timeout=180s

